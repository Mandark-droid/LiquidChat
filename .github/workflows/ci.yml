name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (typecheck, lint, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  android:
    name: Android (full + play debug, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install NDK 27.1.12297006
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
      - uses: gradle/actions/setup-gradle@v4
      # The debug keystore is not in the repository (it also signs sideloaded release builds), so
      # CI signs its debug APKs with a throwaway one using the same alias and passwords.
      - name: Create a throwaway debug keystore
        working-directory: android/app
        run: |
          [ -f debug.keystore ] || keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleFullDebug assemblePlayDebug lintFullDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: liquidchat-debug-apks
          path: |
            android/app/build/outputs/apk/full/debug/app-full-debug.apk
            android/app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-full-debug
          path: android/app/build/reports/lint-results-fullDebug.*
          if-no-files-found: ignore
